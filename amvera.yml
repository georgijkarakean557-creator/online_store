meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

build:
  requirementsPath: requirements.txt
  script:
    - python manage.py collectstatic --no-input
    - python manage.py migrate --no-input

run:
  command: gunicorn core.wsgi:application --bind 0.0.0.0:80
  persistenceMount: /data
  containerPort: 80