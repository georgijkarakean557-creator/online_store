{% extends 'base.html' %}
{% block title %}Удаление адреса{% endblock %}

{% block content %}
<h1>Удаление адреса</h1>
<p>Вы уверены, что хотите удалить адрес <strong>{{ address }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'users:address_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
